<!DOCTYPE html>
<html>
<head>
    <title>Student Login</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Student Login</h1>
    </header>
    <div class="form-box">
        <form id="loginForm" action="/login" method="POST">
            <label>Email</label>
            <input type="email" id="loginEmail" name="email" required placeholder="e.g. student@campus.edu">

            <label>Password</label>
            <input type="password" id="loginPassword" name="password" required placeholder="Enter password">

            <button type="submit">Login</button>
        </form>

        <div style="background-color: #e8e3f5; padding: 10px; border-radius: 4px; margin-top: 15px; font-size: 13px;">
            <b>Demo Admin Login:</b><br>
            Email: <code>admin@campus.edu</code><br>
            Password: <code>admin123</code>
        </div>

        <p>New student? <a href="/register.html">Register here</a></p>
        <p><a href="/">Back to Home</a></p>
    </div>
    <footer>
        <p>Campus Lost and Found System • merin@2026</p>
    </footer>
</body>
</html>
