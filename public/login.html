<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Campus Lost & Found</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="nav-brand">Campus Lost &amp; Found</a>
      <ul class="nav-links">
        <li><a href="index.html">← Back to Home</a></li>
      </ul>
    </div>
  </nav>

  <!-- Login Form Box -->
  <main class="container" style="margin-top: 40px; margin-bottom: 40px;">
    <div class="form-box" style="max-width: 420px;">
      <h2>Student &amp; Staff Login</h2>
      <p class="subtitle">Please enter your credentials to log in.</p>

      <div id="login-alert" class="alert"></div>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Email Address *</label>
          <input type="email" id="login-email" required placeholder="e.g. student@campus.edu">
        </div>

        <div class="form-group">
          <label>Password *</label>
          <input type="password" id="login-password" required placeholder="Enter password">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
          Log In
        </button>
      </form>

      <!-- Examiner Demo Credentials -->
      <div style="background: #eef2f7; border: 1px solid #d1d8e0; border-radius: 4px; padding: 10px; margin-top: 18px; font-size: 0.85rem;">
        <strong>Demo Admin Account:</strong><br>
        Email: <code>admin@campus.edu</code><br>
        Password: <code>admin@12345</code>
      </div>

      <p style="text-align: center; margin-top: 15px; font-size: 0.9rem;">
        New student? <a href="register.html" style="color: #3498db; font-weight: bold;">Create an account</a>
      </p>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>Campus Lost &amp; Found System • Student Mini Project</p>
      <p style="color: #7f8c8d; font-size: 0.8rem; margin-top: 4px;">merin@2026</p>
    </div>
  </footer>

  <script src="js/auth.js"></script>
</body>
</html>
