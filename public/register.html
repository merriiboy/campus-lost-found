<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Student Registration</h1>
    </header>
    <div class="form-box">
        <form id="registerForm" action="/register" method="POST">
            <label>Full Name</label>
            <input type="text" id="name" name="name" required placeholder="e.g. Meriin K Joseph">

            <label>Roll Number / Student ID</label>
            <input type="text" id="rollNo" name="rollNo" required placeholder="e.g. 26CSEL40">

            <label>Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="e.g. 9876543210">

            <label>College Email</label>
            <input type="email" id="email" name="email" required placeholder="e.g. student@campus.edu">

            <label>Password</label>
            <input type="password" id="password" name="password" required placeholder="At least 4 characters">

            <button type="submit">Register</button>
        </form>
        <p>Already registered? <a href="/login.html">Login here</a></p>
        <p><a href="/">Back to Home</a></p>
    </div>
    <footer>
        <p>Campus Lost and Found System • merin@2026</p>
    </footer>
</body>
</html>
